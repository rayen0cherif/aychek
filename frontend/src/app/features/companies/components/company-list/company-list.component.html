<div class="max-w-6xl mx-auto px-4 py-12">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">Companies</h1>
      <p class="text-sm text-zinc-500 mt-1">Browse the directory of monitored organizations.</p>
    </div>
    <div class="relative w-full sm:w-64">
      <svg class="absolute left-3 top-2.5 h-4 w-4 text-zinc-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input 
        type="text" 
        placeholder="Filter by name or sector..." 
        class="w-full pl-9 pr-3 py-2 bg-white border border-zinc-200 text-sm placeholder:text-zinc-400 focus:outline-none focus:border-zinc-900 transition-colors"
        [ngModel]="searchQuery()" 
        (ngModelChange)="searchQuery.set($event)"
      />
    </div>
  </div>

  <p *ngIf="isLoading()" class="py-12 text-center text-sm text-zinc-400">Loading...</p>

  <p *ngIf="error()" class="py-12 text-center text-sm text-red-600">{{ error() }}</p>

  <div *ngIf="!isLoading() && !error() && filteredCompanies().length === 0"
    class="py-12 text-center border border-dashed border-zinc-300">
    <p class="text-sm text-zinc-400">No companies match your search.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 auto-rows-fr"
    *ngIf="filteredCompanies().length > 0">
    <div 
      *ngFor="let company of filteredCompanies()" 
      class="group bg-white border border-zinc-200 p-5 cursor-pointer hover:border-zinc-400 transition-colors flex flex-col h-full"
      (click)="companySelected.emit(company.id)"
    >
      <div class="flex justify-between items-start mb-3">
        <h2 class="text-base font-semibold text-zinc-900 group-hover:underline underline-offset-4">{{ company.name }}</h2>
        <span class="text-[10px] uppercase tracking-wider font-semibold text-zinc-500 bg-zinc-100 px-1.5 py-0.5 shrink-0 ml-2">{{ company.sector }}</span>
      </div>
      <p class="text-sm text-zinc-600 line-clamp-2 mb-4 flex-1">{{ company.description }}</p>
      <div class="flex gap-3 text-xs text-zinc-400 mt-auto pt-4 border-t border-zinc-100">
        <span>{{ company.country }}</span>
        <span>Est. {{ company.foundedYear }}</span>
      </div>
    </div>
  </div>
</div>

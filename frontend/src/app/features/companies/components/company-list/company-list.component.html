<div class="max-w-6xl mx-auto px-4 py-12">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">Companies</h1>
      <p class="text-sm text-zinc-500 mt-1">Browse the directory of monitored organizations.</p>
    </div>
    <div class="flex gap-2 w-full sm:w-auto">
      <button 
        (click)="showWatchlistOnly.set(!showWatchlistOnly())"
        class="px-3 py-2 text-sm font-medium border transition-colors flex items-center gap-1.5 whitespace-nowrap"
        [ngClass]="showWatchlistOnly() ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
      >
        <svg class="w-3.5 h-3.5" [ngClass]="showWatchlistOnly() ? 'fill-white' : 'fill-transparent stroke-zinc-400 stroke-2'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.536a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
        </svg>
        Watchlist
      </button>
      <div class="relative w-full sm:w-64">
        <svg class="absolute left-3 top-2.5 h-4 w-4 text-zinc-400" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" placeholder="Filter by name or sector..."
          class="w-full pl-9 pr-3 py-2 bg-white border border-zinc-200 text-sm placeholder:text-zinc-400 focus:outline-none focus:border-zinc-900 transition-colors"
          [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" />
      </div>
    </div>
  </div>


  <div class="mb-10 bg-white border border-zinc-200 p-6" *ngIf="!isLoading() && !error() && sectorStats().length > 0">
    <h3 class="text-sm font-semibold text-zinc-900 mb-4">Sector Distribution</h3>
    <div class="space-y-3">
      <div *ngFor="let stat of sectorStats()" class="flex items-center gap-4">
        <span class="text-xs text-zinc-600 w-32 truncate" [title]="stat.name">{{ stat.name }}</span>
        <div class="flex-1 h-1.5 bg-zinc-100 overflow-hidden">
          <div class="h-full bg-zinc-800 transition-all duration-500 ease-out" [style.width.%]="stat.percentage"></div>
        </div>
        <span class="text-xs font-medium text-zinc-900 w-8 text-right">{{ stat.count }}</span>
      </div>
    </div>
  </div>

  <p *ngIf="isLoading()" class="py-12 text-center text-sm text-zinc-400">Loading...</p>

  <p *ngIf="error()" class="py-12 text-center text-sm text-red-600">{{ error() }}</p>

  <div *ngIf="!isLoading() && !error() && filteredCompanies().length === 0"
    class="py-12 text-center border border-dashed border-zinc-300">
    <p class="text-sm text-zinc-400">No companies match your search.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 auto-rows-fr" *ngIf="filteredCompanies().length > 0">
    <div *ngFor="let company of filteredCompanies()"
      class="group bg-white border border-zinc-200 p-5 cursor-pointer hover:border-zinc-400 transition-colors flex flex-col h-full"
      (click)="companySelected.emit(company.id)">
      <div class="flex justify-between items-start mb-3">
        <h2 class="text-base font-semibold text-zinc-900 group-hover:underline underline-offset-4 flex items-center gap-2">
          {{ company.name }}
          <svg *ngIf="watchlistIds().has(company.id)" class="w-4 h-4 text-amber-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" />
          </svg>
        </h2>
        <span
          class="text-[10px] uppercase tracking-wider font-semibold text-zinc-500 bg-zinc-100 px-1.5 py-0.5 shrink-0 ml-2">{{
          company.sector }}</span>
      </div>
      <p class="text-sm text-zinc-600 line-clamp-2 mb-4 flex-1">{{ company.description }}</p>
      <div class="flex gap-3 text-xs text-zinc-400 mt-auto pt-4 border-t border-zinc-100">
        <span>{{ company.country }}</span>
        <span>Est. {{ company.foundedYear }}</span>
      </div>
    </div>
  </div>
</div>
